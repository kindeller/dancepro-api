    AvailabilityRequest:
      type: object
      required: [shift_id, event_name, event_type, event_code, organisation, venue, shift_period, shift_date, arrival_at, starts_at, finish_at, status, locked, allowed_actions]
      properties:
        shift_id:
          type: string
          format: uuid
        event_name:
          type: string
        event_type:
          type: string
          enum: [concert, competition]
        event_code:
          type: [string, 'null']
          description: Concerts and DR use the saved studio code plus four-digit event year, for example K2D2026, shared by all studio events that year. Competitions use the saved competition code plus first event month (without a leading zero) and two-digit year, for example EDC926 or EDC1026. Null when the organisation code or date is missing. Automatically derived; not a unique identifier.
          example: EDC926
        event_logo_url:
          type: [string, 'null']
          format: uri
          description: Absolute public artwork URL requiring no bearer token or browser session. Concerts prefer the studio logo; competitions prefer the competition contact logo. Both fall back to the event logo, or null for the app placeholder.
        organisation:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            - type: 'null'
        venue:
          oneOf:
            - $ref: '#/components/schemas/Venue'
            - type: 'null'
        shift_period:
          type: [string, 'null']
          enum: [morning, afternoon, null]
        shift_date:
          type: string
          format: date
        arrival_at:
          type: [string, 'null']
          format: date-time
        starts_at:
          type: [string, 'null']
          format: date-time
        finish_at:
          type: [string, 'null']
          format: date-time
        deadline:
          type: [string, 'null']
          format: date-time
        status:
          type: [string, 'null']
          enum: [available, unavailable, null]
        note:
          type: [string, 'null']
        locked:
          type: boolean
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [update, clear]
