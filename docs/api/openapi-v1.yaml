          application/json:
            schema:
              type: object
              properties:
                selected_option:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 99
                answers:
                  type: [array, 'null']
                  maxItems: 100
                  items: {}
      responses:
        '200':
          description: Module result recorded and refreshed course progress returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrainingCourseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Store credentials only in the platform secure credential store.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: [string, 'null']
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Reuse the same UUID only when retrying the exact same operation. Replayed responses include `Idempotency-Replayed: true`; conflicting or in-progress reuse returns HTTP 409."
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CoverRequestId:
      name: coverRequest
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftId:
      name: shift
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChecklistItemId:
      name: item
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatId:
      name: chat
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoice
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingCourseId:
      name: course
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingModuleId:
      name: module
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notification
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimesheetFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
    TimesheetTo:
      name: to
      in: query
      schema:
        type: string
        format: date
    TimesheetStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [draft, ready_to_invoice, externally_invoiced, invoiced, cancelled]
  responses:
    AuthenticationResponse:
      description: Authentication succeeded.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Authentication'
    EmptySuccess:
      description: Operation completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Unauthenticated:
      description: Missing, expired, or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The account cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not visible to this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource state changed; refresh before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
        two_factor_code:
          type: [string, 'null']
          pattern: '^\d{6}$'
        recovery_code:
          type: [string, 'null']
          maxLength: 255
    Authentication:
      type: object
      required: [token, token_type, expires_at, user]
      properties:
        token:
          type: string
          writeOnly: true
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, name, email, capabilities, onboarding_complete, onboarding_missing, two_factor_enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [crew, admin]
        onboarding_complete:
          type: boolean
        onboarding_missing:
          type: array
          description: Opaque requirement keys used to route the app to profile or contract completion.
          items:
            type: string
        two_factor_enabled:
          type: boolean
    MobileDevice:
      type: object
      required: [id, name, current, last_used_at, expires_at]
      properties:
        id:
          type: string
          description: Opaque device-session identifier; this is not a database or bearer-token identifier.
          pattern: '^[a-f0-9]{64}$'
        name:
          type: string
        current:
          type: boolean
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
    Dashboard:
      type: object
      required: [next_assignment, unread_notifications, unread_chats, pending_availability, pending_invoices, pending_acknowledgements, pending_cover_requests, pending_timesheets]
      properties:
        next_assignment:
          oneOf:
            - $ref: '#/components/schemas/AssignmentSummary'
            - type: 'null'
        unread_notifications:
          type: integer
          minimum: 0
        unread_chats:
          type: integer
          minimum: 0
        pending_availability:
          type: integer
          minimum: 0
        pending_invoices:
          type: integer
          minimum: 0
        pending_acknowledgements:
          type: integer
          minimum: 0
        pending_cover_requests:
          type: integer
          minimum: 0
        pending_timesheets:
          type: integer
          minimum: 0
    AssignmentCollectionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AssignmentSummary'
            meta:
              $ref: '#/components/schemas/CursorMeta'
    AssignmentSummary:
      type: object
      required: [id, event_name, event_type, event_code, role, is_team_leader, shift_code, shift_date, status, cancelled, acknowledged, allowed_actions]
      properties:
        id:
          type: string
          format: uuid
        event_name:
          type: string
        event_type:
          type: string
          enum: [competition, concert]
        event_code:
          type: [string, 'null']
          description: Concerts and DR use the saved studio code plus four-digit event year, for example K2D2026, shared by all studio events that year. Competitions use the saved competition code plus first event month (without a leading zero) and two-digit year, for example EDC926 or EDC1026. Null when the organisation code or date is missing. Automatically derived; not a unique identifier.
          example: EDC926
        event_logo_url:
          type: [string, 'null']
          format: uri
          description: Absolute public artwork URL requiring no bearer token or browser session. Concerts prefer the studio logo; competitions prefer the competition contact logo. Both fall back to the event logo, or null for the app placeholder.
        event_item_title:
          type: [string, 'null']
        role:
          type: string
        is_team_leader:
          type: boolean
        shift_period:
          type: [string, 'null']
          enum: [morning, afternoon, null]
        shift_code:
          type: string
          description: Configured event type code (for example CON or DR); competition sessions use COMP-M or COMP-A. Older concerts without a configured type use CON.
          examples: [CON, DR, COMP-M, COMP-A]
        shift_date:
          type: string
          format: date
        arrival_at:
          type: [string, 'null']
          format: date-time
        starts_at:
          type: [string, 'null']
          format: date-time
        estimated_finish_at:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [draft, published, cancelled]
        cancelled:
          type: boolean
        cancelled_at:
          type: [string, 'null']
          format: date-time
        acknowledged:
          type: boolean
        cover_request:
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id: { type: string, format: uuid }
