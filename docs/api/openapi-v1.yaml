openapi: 3.1.0
info:
  title: DancePro Crew Mobile API
  version: 1.0.0-draft
  description: |
    Contract for the native Crew Hub application. All operations in this file
    are planned until their `x-implementation-status` is changed to `available`.
    Existing unversioned media and download APIs are outside this contract and
    remain backwards compatible.
servers:
  - url: https://api.example.invalid/api/v1
    description: Replace with the production HTTPS origin at deployment.
tags:
  - name: Authentication
  - name: Dashboard
  - name: Assignments
  - name: Cover Requests
  - name: Availability
  - name: Directory
  - name: Profile
  - name: Chat
  - name: Notifications
  - name: App Configuration
  - name: Timesheets
  - name: Contracts
  - name: Documents
  - name: Training
security:
  - bearerAuth: []
paths:
  /auth/forgot-password:
    post:
      tags: [Authentication]
      security: []
      operationId: forgotPassword
      x-implementation-status: available
      summary: Send an enumeration-safe password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Generic reset-link result returned. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/two-factor:
    post:
      tags: [Authentication]
      operationId: beginTwoFactor
      x-implementation-status: available
      summary: Start two-factor setup after password confirmation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Secret and provisioning URI returned. }
    delete:
      tags: [Authentication]
      operationId: disableTwoFactor
      x-implementation-status: available
      summary: Disable two-factor authentication and revoke other mobile sessions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Two-factor authentication disabled. }
  /auth/two-factor/confirm:
    post:
      tags: [Authentication]
      operationId: confirmTwoFactor
      x-implementation-status: available
      summary: Confirm a pending TOTP setup and return recovery codes once
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Two-factor authentication enabled. }
  /auth/two-factor/recovery-codes:
    post:
      tags: [Authentication]
      operationId: regenerateTwoFactorRecoveryCodes
      x-implementation-status: available
      summary: Replace all two-factor recovery codes after password confirmation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: New recovery codes returned once. }
  /address-search:
    get:
      tags: [Profile]
      operationId: searchAustralianAddresses
      x-implementation-status: available
      summary: Return cached Australian address suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Up to ten suggestions returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 10
                        items:
                          $ref: '#/components/schemas/AddressSuggestion'
        '429': { $ref: '#/components/responses/RateLimited' }
  /address-search/{placeId}:
    get:
      tags: [Profile]
      operationId: resolveAustralianAddress
      x-implementation-status: available
      summary: Resolve a cached Google place identifier into structured Australian address fields
      parameters:
        - name: placeId
          in: path
          required: true
          schema: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Structured address returned, or null when unavailable or not Australian.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ResolvedAddress'
                          - type: 'null'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /app-config:
    get:
      tags: [App Configuration]
      security: []
      operationId: mobileAppConfig
      x-implementation-status: available
      summary: Return public mobile version, maintenance and support configuration
      responses:
        '200':
          description: App configuration returned.
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      x-implementation-status: available
      summary: Authenticate an active crew member and issue device credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /push-devices:
    post:
      tags: [Notifications]
      operationId: registerPushDevice
      x-implementation-status: available
      summary: Register or rotate the current installation's encrypted push token
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Redacted push-device registration returned.
        '422':
          $ref: '#/components/responses/ValidationError'
  /push-devices/{device}:
    delete:
      tags: [Notifications]
      operationId: removePushDevice
      x-implementation-status: available
      parameters:
        - name: device
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-implementation-status: available
      summary: Revoke the current device credentials
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      x-implementation-status: available
      summary: Return the authenticated crew identity and capabilities
      responses:
        '200':
          description: Current user returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/devices:
    get:
      tags: [Authentication]
      operationId: listMobileDevices
      x-implementation-status: available
      summary: List the current crew member's mobile sessions
      responses:
        '200':
          description: Mobile sessions returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MobileDevice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/devices/{device}:
    delete:
      tags: [Authentication]
      operationId: revokeMobileDevice
      x-implementation-status: available
      summary: Revoke one of the current crew member's mobile sessions
      parameters:
        - name: device
          in: path
          required: true
          description: Opaque device-session identifier returned by the device list.
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: crewDashboard
      x-implementation-status: available
      summary: Return the compact My Hub dashboard
      responses:
        '200':
          description: Dashboard returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /assignments:
    get:
      tags: [Assignments]
      operationId: listAssignments
      x-implementation-status: available
      summary: List assignments visible to the current crew member
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: scope
          in: query
          schema:
            type: string
            enum: [upcoming, past, cancelled, all]
            default: upcoming
      responses:
        '200':
          description: Assignments returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentCollectionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /assignments/{assignment}:
    get:
      tags: [Assignments]
      operationId: showAssignment
      x-implementation-status: available
      summary: Return an assignment owned by the current crew member
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Assignment returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssignmentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /assignments/{assignment}/files/{kind}/download:
    post:
      tags: [Assignments]
      operationId: issueAssignmentFileDownload
      x-implementation-status: available
      summary: Issue a ten-minute signed URL for one file on an assignment owned by the current crew member
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [programme, venue-map, venue-reference]
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Temporary assignment-file download issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssignmentFileDownload'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assignments/{assignment}/acknowledgement:
    put:
      tags: [Assignments]
      operationId: acknowledgeAssignment
      x-implementation-status: available
      summary: Acknowledge the current published assignment version
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /assignments/{assignment}/checklist-items/{item}:
    put:
      tags: [Assignments]
      operationId: updateChecklistItem
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/ChecklistItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '404':
          $ref: '#/components/responses/NotFound'
  /assignments/{assignment}/clock-in:
    post:
      tags: [Timesheets]
      operationId: clockInAssignment
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Clock-in recorded and current time state returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assignments/{assignment}/clock-out:
    post:
      tags: [Timesheets]
      operationId: clockOutAssignment
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Clock-out recorded and current time state returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assignments/{assignment}/time:
    put:
      tags: [Timesheets]
      operationId: updateAssignmentTime
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actual_clock_in_at:
                  type: [string, 'null']
                actual_finish_at:
                  type: [string, 'null']
                optional_note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '200':
          description: Corrected time state returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assignments/{assignment}/finish-team:
    post:
      tags: [Timesheets]
      operationId: finishAssignmentTeam
      x-implementation-status: available
      summary: Record one competition team's finish time as its team leader
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_finish_at]
              properties:
                actual_finish_at:
                  type: string
                optional_note:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '200':
          description: Number of unfinished team assignments updated.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cover-requests:
    get:
      tags: [Cover Requests]
      operationId: listCoverRequests
      x-implementation-status: available
      summary: List cover requests sent to or created by the current crew member
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cover requests returned newest first with direction on each record.
  /assignments/{assignment}/cover-requests:
    post:
      tags: [Cover Requests]
      operationId: createCoverRequest
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                message:
                  type: [string, 'null']
                  maxLength: 1000
      responses:
        '200':
          description: Created cover request returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assignments/{assignment}/cover-candidates:
    get:
      tags: [Cover Requests]
      operationId: listCoverCandidates
      x-implementation-status: available
      summary: List active, qualified and conflict-free crew eligible to cover the assignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Eligible candidates and their recorded availability returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoverCandidate'
        '404':
          $ref: '#/components/responses/NotFound'
  /cover-requests/{coverRequest}/accept:
    post:
      tags: [Cover Requests]
      operationId: acceptCoverRequest
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/CoverRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted request and replacement assignment identifier returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /availability:
    get:
      tags: [Availability]
      operationId: listAvailabilityRequests
      x-implementation-status: available
      responses:
        '200':
          description: Availability requests returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AvailabilityRequest'
  /availability/{shift}:
    put:
      tags: [Availability]
      operationId: updateAvailability
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [available, unavailable]
                note:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '200':
          description: Updated availability request returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AvailabilityRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Availability]
      operationId: clearAvailability
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cleared availability request returned with a null status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AvailabilityRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /directory:
    get:
      tags: [Directory]
      operationId: directory
      x-implementation-status: available
      summary: Return active crew, studios, and competitions permitted in My Crew
      responses:
        '200':
          description: Directory returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Directory'
  /profile:
    get:
      tags: [Profile]
      operationId: showProfile
      x-implementation-status: available
      responses:
        '200':
          description: Own profile returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CrewProfile'
    put:
      tags: [Profile]
      operationId: updateProfile
      x-implementation-status: available
      summary: Update permitted fields on the current crew profile
      description: Supplying payment_details requires the current account password.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileUpdateResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profile/password:
    put:
      tags: [Profile]
      operationId: changePassword
      x-implementation-status: available
      summary: Change the current password and revoke every other API session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Refreshed user and applied session policy returned.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /chats:
    get:
      tags: [Chat]
      operationId: listChats
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, unread, upcoming, events, direct]
            default: all
      responses:
        '200':
          description: Chats returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatSummary'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'
  /chats/{chat}/messages:
    get:
      tags: [Chat]
      operationId: listChatMessages
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages returned newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Chat]
      operationId: postChatMessage
      x-implementation-status: available
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 10000
          multipart/form-data:
            schema:
              type: object
              description: At least one of body or attachment is required. Attachments are supported in event and direct chats, up to 10 MB.
              properties:
                body:
                  type: string
                  maxLength: 10000
                attachment:
                  type: string
                  format: binary
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatMessage'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /chats/{chat}/messages/{message}/attachment:
    get:
      tags: [Chat]
      operationId: downloadChatAttachment
      x-implementation-status: available
      summary: Download an attachment from an event or direct chat accessible to the current crew member
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - name: message
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Private attachment content.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/octet-stream:
              schema:
                type: string
