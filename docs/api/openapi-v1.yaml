  /training:
    get:
      tags: [Training]
      operationId: listTraining
      x-implementation-status: available
      responses:
        '200':
          description: Assigned training returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
